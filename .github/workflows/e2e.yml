name: browser tests

# A change to the site's pages is tested against the ticket server's test suite:
# the server repo's browser tests boot the real API and drive these pages.
on:
  push:
    branches: [main]
    paths: ["*.html", "styles.css"]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: nerx-site }
      - uses: actions/checkout@v4
        with:
          repository: prefection80/nerx-tickets
          path: nerx-tickets
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r nerx-tickets/requirements.txt -r nerx-tickets/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e -q
        working-directory: nerx-tickets
        env:
          NERX_SITE_DIR: ${{ github.workspace }}/nerx-site
