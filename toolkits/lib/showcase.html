<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nerx-signals — showcase deck</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{ --bg:#0a1017; --panel:#0f1822; --line:#22323f; --ink:#e9eef4; --mut:#8ca0b2; --faint:#5e7182;
         --pos:#5aa9e0; --neg:#e2765f; --zero:#9cc55f; }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans",system-ui,sans-serif; overflow:hidden}
  #deck{position:fixed; inset:0}
  .slide{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:38px;
    padding:52px 64px 92px; opacity:0; pointer-events:none; transition:opacity .35s ease; }
  .slide.active{opacity:1; pointer-events:auto}
  .stage{flex:1 1 60%; max-width:820px; background:#070d13; border:1px solid var(--line); border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.5); overflow:hidden}
  .stage canvas{display:block; width:100%; background:#f7fafc}
  .caption{flex:0 1 30%; min-width:250px; max-width:380px}
  .caption .kicker{font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--pos)}
  .caption h2{font-size:1.7rem; font-weight:600; letter-spacing:-.01em; margin:8px 0 12px; line-height:1.15; text-wrap:balance}
  .caption p{color:var(--mut); font-size:1rem; line-height:1.55; margin-bottom:16px}
  .caption code{display:block; font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:#a9c4d8;
    background:#0c141d; border:1px solid var(--line); border-left:2px solid var(--pos); border-radius:6px; padding:11px 13px; line-height:1.6; white-space:pre; overflow-x:auto}

  /* title slide */
  .slide.title{flex-direction:column; gap:0; text-align:center}
  .slide.title .stage{flex:none; width:min(720px,80vw); margin-bottom:26px}
  .slide.title h1{font-size:clamp(2.2rem,6vw,3.4rem); font-weight:700; letter-spacing:-.03em}
  .slide.title .lede{color:var(--mut); font-size:1.15rem; margin-top:12px; max-width:56ch}
  .slide.title .hint{color:var(--faint); font-family:"IBM Plex Mono",monospace; font-size:.8rem; margin-top:22px}

  /* nav */
  #nav{position:fixed; left:0; right:0; bottom:0; height:56px; display:flex; align-items:center; justify-content:center;
    gap:16px; background:linear-gradient(transparent, rgba(7,13,19,.9) 40%); z-index:20}
  #nav button{background:#12202c; color:var(--ink); border:1px solid var(--line); border-radius:8px; width:34px; height:34px;
    font-size:1.1rem; cursor:pointer; line-height:1}
  #nav button:hover{border-color:var(--pos); color:var(--pos)}
  .dots{display:flex; gap:8px}
  .dots i{width:9px; height:9px; border-radius:50%; background:#2b3d4b; cursor:pointer; display:block; transition:background .2s}
  .dots i.on{background:var(--pos)}
  #count{font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--mut); min-width:46px; text-align:center}
  @media (max-width:760px){ .slide{flex-direction:column; padding:34px 26px 80px; gap:20px} .caption{max-width:none} }
</style>
</head>
<body>
<div id="deck"></div>
<div id="nav">
  <button id="prev" aria-label="Previous">‹</button>
  <div class="dots" id="dots"></div>
  <span id="count"></span>
  <button id="next" aria-label="Next">›</button>
</div>

<script src="nerx-signals.js"></script>
<script>
const S = NS.calc.SEQ, TAU = NS.calc.TAU, cal = NS.calc;
const tF = 0.08;

// each slide: its component factory + text. Components read canvas size in draw(), so they adapt.
const SLIDES = [
  { title: true, name: 'nerx-signals',
    lede: 'A dependency-free toolkit for power-engineering visualizations — one calc engine, ten live plot components.',
    aspect: 0.42,
    make: () => NS.Phasor(null, { radius: 96, rotate: 'ccw', freq: 0.14, waveform: 'right', refCircle: true,
      phasors: () => [ {mag:1,ang:0,color:S.pos,label:'a'},{mag:1,ang:-120,color:S.neg,label:'b'},{mag:1,ang:120,color:S.zero,label:'c'} ] }) },

  { kicker: 'Phasor', name: 'The spinning arrow is the waveform', aspect: 0.42,
    desc: 'Rotating three-phase phasors, each projecting the sinusoid it traces. Static, rotating, or sweep — with a reference frame and optional tip locus.',
    code: "NS.Phasor({\n  rotate:'ccw', freq:0.16,\n  waveform:'right',\n  phasors:()=>[…],\n})",
    make: () => NS.Phasor(null, { radius: 96, rotate: 'ccw', freq: 0.16, waveform: 'right', refCircle: true,
      phasors: () => [ {mag:1.2,ang:0,color:S.pos,label:'a'},{mag:1,ang:-120,color:S.neg,label:'b'},{mag:1,ang:120,color:S.zero,label:'c'} ] }) },

  { kicker: 'Scope', name: 'A relay event record', aspect: 0.5,
    desc: 'Multi-channel oscillography on a cycle grid. The 3I₀ residual is derived from the phase traces — dead flat until the ground fault at the trigger, then the whole story.',
    code: "NS.Scope({\n  window:0.25, freq:60, trigger:0.08,\n  motion:'sweep',\n  channels:()=>[…, {derived:'residual'}],\n})",
    make: () => NS.Scope(null, { window: 0.25, freq: 60, trigger: tF, motion: 'sweep', channels: () => {
      const tau = 12/(TAU*60);
      return [
        { name:'Ia', color:S.pos, signal:t=> t<tF ? 0.7*Math.sin(TAU*60*t) : 4*Math.sin(TAU*60*t+0.4)+3*Math.exp(-(t-tF)/tau) },
        { name:'Ib', color:S.neg, signal:t=> 0.7*Math.sin(TAU*60*t-2.094) },
        { name:'Ic', color:S.zero, signal:t=> 0.7*Math.sin(TAU*60*t+2.094) },
        { name:'3I₀', color:'#c9a24a', derived:'residual' },
      ]; } }) },

  { kicker: 'Impedance', name: 'R–X plane — distance relaying', aspect: 0.62,
    desc: 'Mho or quadrilateral zones, and a live apparent-impedance point tracing a power swing through the characteristics, leaving a trail.',
    code: "NS.Impedance({\n  zones:[{type:'mho',reach:0.7,angle:75}…],\n  point:t=>({r,x}), trail:true,\n})",
    make: () => NS.Impedance(null, { range: 1.2, trail: true, pointLabel: 'Z', zones: [
        { type:'mho', reach:0.4, angle:75, color:S.pos, label:'Z1' },
        { type:'mho', reach:0.7, angle:75, color:S.zero, label:'Z2', dash:[6,4] },
        { type:'mho', reach:1.0, angle:75, color:S.neg, label:'Z3', dash:[2,4] },
      ], point: t => { const th = t*0.6; return { r:0.55*Math.cos(th)+0.1, x:0.45+0.55*Math.sin(th) }; } }) },

  { kicker: 'Coordination', name: 'Time-current curves', aspect: 0.6,
    desc: 'Log-log TCC for a relay against a fuse, with the fault current sweeping back and forth — watch which device is faster where.',
    code: "NS.Coordination({\n  devices:()=>[{curve:I=>\n    calc.ocTime('IEEE-VI',I/pickup,TD)}…],\n  faultCurrent:()=>amps,\n})",
    make: () => NS.Coordination(null, { iMin:100, iMax:100000, tMin:0.01, tMax:100,
      devices: () => [
        { name:'51 · IEEE-VI', color:S.pos, curve:I=> cal.ocTime('IEEE-VI', I/600, 3) },
        { name:'fuse', color:S.zero, curve:I=> I>300 ? 1e6/Math.pow(I,1.6) : null },
      ],
      faultCurrent: t => 2500 * Math.pow(14, 0.5+0.5*Math.sin(t*0.5)) }) },

  { kicker: 'Stability', name: 'Power-angle & equal area', aspect: 0.54,
    desc: 'Pre-fault, fault and post-fault P–δ curves with the accelerating (red) and decelerating (green) areas, and the rotor angle swinging between them.',
    code: "NS.Stability({\n  pmax:1.8, pmaxFault:0.5, pmaxPost:1.5,\n  pm:1.0, clearAngle:1.15,\n})",
    make: () => NS.Stability(null, { pmax:1.8, pmaxFault:0.5, pmaxPost:1.5, pm:1.0, clearAngle:1.15, period:4.5 }) },

  { kicker: 'Spectrum', name: 'Harmonics & THD', aspect: 0.58,
    desc: 'A harmonic bar chart as a % of the fundamental, linked to its composite waveform. Here the 5th and 7th breathe, and the THD reads out live.',
    code: "NS.Spectrum({\n  showWave:true,\n  harmonics:()=>[{n:1,mag:1},{n:5,mag:…}],\n})",
    make: () => NS.Spectrum(null, { showWave:true, cycles:2, maxOrder:13, harmonics: t => [
        { n:1, mag:1 }, { n:3, mag:0.22 },
        { n:5, mag:0.10 + 0.12*(0.5+0.5*Math.sin(t*0.9)) },
        { n:7, mag:0.05 + 0.07*(0.5+0.5*Math.sin(t*0.9+2)) },
      ] }) },

  { kicker: 'One-line', name: 'Animated power flow', aspect: 0.5,
    desc: 'A schematic — source, buses, transformer, feeders — with current flowing as dots along the conductors; thickness tracks magnitude, direction tracks sign.',
    code: "NS.OneLine({\n  nodes:{ src:{x,y,type:'source'}…},\n  edges:()=>[{from,to,flow}],\n})",
    make: () => NS.OneLine(null, { nodes: {
        src:{x:80,y:52,type:'source',label:'Utility',lx:-70}, b1:{x:80,y:106,type:'bus',w:48,label:'115 kV',lx:-72},
        tx:{x:80,y:160,type:'xfmr'}, b2:{x:80,y:214,type:'bus',w:48,label:'13.8 kV',lx:-76},
        ld1:{x:250,y:214,type:'load',label:'Feeder A',ly:30,lx:-26}, ld2:{x:430,y:214,type:'load',label:'Feeder B',ly:30,lx:-26},
      }, edges: () => [
        {from:'src',to:'b1',flow:1.4,flowColor:S.pos}, {from:'b1',to:'tx',flow:1.4,flowColor:S.pos},
        {from:'tx',to:'b2',flow:1.3,flowColor:S.pos}, {from:'b2',to:'ld1',flow:0.7,flowColor:S.zero},
        {from:'b2',to:'ld2',flow:0.6,flowColor:S.zero},
      ] }) },

  { kicker: 'Power', name: 'What power factor actually costs', aspect: 0.36,
    desc: 'V and I with the angle between them, p = v·i underneath, and the P–Q–S triangle. The middle panel is the point: p ripples at twice line frequency, averages to P, and the red lobes are energy handed back to the source. At unity they vanish.',
    code: "NS.Power({\n  v:1, i:()=>amps, pf:()=>pf,\n  show:['dial','instantaneous','triangle'],\n})",
    make: () => NS.Power({ v: 1, i: 1, pf: t => 0.55 + 0.44*(0.5+0.5*Math.sin(t*0.42)), cycles: 2 }) },

  { kicker: 'Decompose', name: 'The transform as a construction', aspect: 0.42,
    desc: 'Not a matrix — rotate by the a-operator, add tip to tail, divide by three. Runs the positive-sequence row on an unbalanced set; drive `progress` yourself to step it in front of a class.',
    code: "NS.Decompose({\n  terms:()=>[{z:Va,rot:0},\n    {z:Vb,rot:120},{z:Vc,rot:240}],\n  divide:3, result:{label:'V₁'},\n})",
    make: () => NS.Decompose({ divide: 3, period: 9, result: { label: 'V₁' }, terms: () => [
        { z: cal.polar(1.35, 0),    rot: 0,   label: 'Vₐ',   color: S.pos },
        { z: cal.polar(1, -120),    rot: 120, label: 'a·Vb',  color: S.neg },
        { z: cal.polar(1, 120),     rot: 240, label: 'a²·Vc', color: S.zero },
      ] }) },

  { kicker: 'Estimator', name: 'Why the relay needs a cycle', aspect: 0.5,
    desc: 'A one-cycle DFT window slides along the record. The phasor it produces is on the dial; its magnitude against window position is on the right. The estimate is only true once the window sits entirely inside the fault — everything before that is a ramp.',
    code: "NS.Estimator({\n  signal:t=>…, freq:60, fs:1920,\n  window:1, span:0.15,\n  refs:[{mag:3,label:'fault'}],\n})",
    make: () => NS.Estimator({ freq: 60, fs: 1920, span: 0.15, window: 1, trigger: 0.05, sweepPeriod: 7,
      signal: t => t < 0.05 ? 0.5*Math.sin(TAU*60*t) : 3*Math.sin(TAU*60*t) + 2.2*Math.exp(-(t-0.05)/(14/(TAU*60))),
      refs: [{ mag: 0.5, label: 'load' }, { mag: 3, label: 'fault' }] }) },
];

/* ---- build the deck DOM ---- */
const deck = document.getElementById('deck'), dots = document.getElementById('dots');
const insts = [];
SLIDES.forEach((sl, i) => {
  const sec = document.createElement('section');
  sec.className = 'slide' + (sl.title ? ' title' : '') + (i === 0 ? ' active' : '');
  const cv = document.createElement('canvas');
  const stage = document.createElement('div'); stage.className = 'stage'; stage.appendChild(cv);
  if (sl.title) {
    sec.appendChild(stage);
    const h = document.createElement('h1'); h.textContent = sl.name;
    const p = document.createElement('p'); p.className = 'lede'; p.textContent = sl.lede;
    const hint = document.createElement('p'); hint.className = 'hint'; hint.textContent = 'use  ← →  or the dots to move through the ten components';
    sec.appendChild(h); sec.appendChild(p); sec.appendChild(hint);
  } else {
    const cap = document.createElement('div'); cap.className = 'caption';
    cap.innerHTML = '<div class="kicker">' + sl.kicker + '</div><h2>' + sl.name + '</h2><p>' + sl.desc + '</p>' +
      (sl.code ? '<code>' + sl.code.replace(/</g,'&lt;') + '</code>' : '');
    sec.appendChild(stage); sec.appendChild(cap);
  }
  deck.appendChild(sec);
  insts.push({ sec, cv, comp: sl.make(), aspect: sl.aspect || 0.42 });
  const d = document.createElement('i'); if (i === 0) d.className = 'on'; d.onclick = () => go(i); dots.appendChild(d);
});

function fit(o){ const w = o.cv.parentElement.clientWidth || 720; o.cv.width = Math.round(w); o.cv.height = Math.round(w * o.aspect); }
let cur = 0;
function go(i){
  cur = (i + SLIDES.length) % SLIDES.length;
  insts.forEach((o, k) => o.sec.classList.toggle('active', k === cur));
  [...dots.children].forEach((d, k) => d.classList.toggle('on', k === cur));
  document.getElementById('count').textContent = (cur + 1) + ' / ' + SLIDES.length;
  fit(insts[cur]); paint();
}
document.getElementById('next').onclick = () => go(cur + 1);
document.getElementById('prev').onclick = () => go(cur - 1);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { go(cur + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(cur - 1); e.preventDefault(); }
  else if (e.key === 'Home') go(0); else if (e.key === 'End') go(SLIDES.length - 1);
});
addEventListener('resize', () => { fit(insts[cur]); paint(); });

/* ---- one render loop; only the active slide animates ---- */
/* Reduced motion stops the clock, not the deck: every slide change still paints a frame. */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let t0 = null, tNow = reduce ? 1.2 : 0;
function paint(){
  const o = insts[cur]; if (!o || !o.cv.width) return;
  const ctx = o.cv.getContext('2d'); ctx.clearRect(0,0,o.cv.width,o.cv.height);
  try { o.comp.draw(ctx, tNow); } catch (e) { console.error(e); }
}
function frame(ts){
  if (t0 == null) t0 = ts; tNow = (ts - t0) / 1000;
  paint(); requestAnimationFrame(frame);
}
go(0);
if (reduce) paint(); else requestAnimationFrame(frame);
</script>
</body>
</html>
